[package]
name = "webtransport"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "C ABI for wtransport (WebTransport over HTTP/3), consumed by package:webtransport"
license = "MIT"
publish = false

[lib]
name = "webtransport"
# `native_toolchain_rust` requires both; Flutter resolves the dynamic one.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
bytes = "1.4"
rustls-pki-types = { version = "1.13", features = ["std"] }
tokio = { version = "1.28", features = [
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "io-util",
    "fs",
] }
wtransport = { version = "0.7.2", default-features = false, features = ["ring"] }

[features]
# `ring` avoids the `aws-lc-sys` C toolchain dependency (cmake + nasm), which
# keeps the Flutter build hook self-contained on every host platform.
default = ["self-signed", "dangerous-configuration"]
# Server side self-signed identities (`wt_server_config_set_self_signed`).
self-signed = ["wtransport/self-signed"]
# Adds `wt_client_config_set_no_certificate_validation` (tests and demos only).
dangerous-configuration = ["wtransport/dangerous-configuration"]

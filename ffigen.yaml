# Dart bindings for the `webtransport` code asset.
#
# `src/webtransport.h` is generated from the Rust sources by cbindgen
# (see `rust/cbindgen.toml`). Regenerate both with:
#
#     dart run tool/generate_bindings.dart
#
# then regenerate the Dart bindings from the header with:
#
#     dart run ffigen --config ffigen.yaml
name: WebtransportBindings
description: |
  Bindings for `src/webtransport.h`.

  Do not edit the generated file by hand: it is produced from the cbindgen
  output of the Rust crate in `rust/`.
output: 'lib/webtransport_bindings_generated.dart'
headers:
  entry-points:
    - 'src/webtransport.h'
  include-directives:
    - 'src/webtransport.h'
# Emit `@Native` bindings so the symbols are resolved through the code asset
# declared by `hook/build.dart`. Without `asset-id`, Dart derives it from this
# file's URI, i.e. `package:webtransport/webtransport_bindings_generated.dart`,
# which is exactly the asset name the build hook publishes.
ffi-native:
# `wt_status_t` and `wt_op_t` are `#[repr(C)]` enums in Rust, so every supported
# ABI (MSVC, clang, gcc) gives them `int` width; ffigen's "implementation
# defined enum width" warning does not apply here.
silence-enum-warning: true
comments:
  style: any
  length: full
